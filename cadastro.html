<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
    <title>Cadastro</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid justify-content-center">
                <a class="navbar-brand" href="index.html">
                    <img src="logo.png" height="100" alt="Logo">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse flex-grow-0 justify-content-center" id="navbarNav">
                    <ul class="navbar-nav text-center">
                        <li class="nav-item"><a class="nav-link" href="index.html">PRODUTOS</a></li>
                        <li class="nav-item"><a class="nav-link" href="carrinho.html">CARRINHO</a></li>
                        <li class="nav-item active" id="nav-login"><a class="nav-link" href="login.html">LOGIN</a></li>
                    </ul>
                    <div class="dropdown m-3">
                        <button id="user-info" class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="display: none">
                            Opções
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="cadastro.html">Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">Sair</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main class="d-flex justify-content-center align-items-center">
        <form id="form_cadastro">
            <h1 style="text-align: center;">Cadastro</h1>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" required class="input_texto">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required class="input_texto">
            <label for="celular">Celular:</label>
            <input type="tel" id="celular" placeholder="(99)99999-9999" maxlength="14" required class="input_texto">
            <label for="email">Email:</label>
            <input type="email" id="email" required class="input_texto">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" required class="input_texto">
            <input type="submit" id="btn_enviar" value="Enviar Cadastro" class="btn_enviar">
        </form>
        <!-- ALERTA TOAST -->
        <div class="position-fixed" style="top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1050;">
            <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="5000">
                <div class="d-flex">
                    <div class="toast-body" id="toast-message">Mensagem</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
                </div>
            </div>
        </div>
        <!-- FIM ALERTA TOAST -->
    </main>
    <footer></footer>

    <script src="./pages.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        const API_URL = "http://localhost:3000"
        const form_cadastro = document.getElementById("form_cadastro")
        const btn_enviar = document.getElementById("btn_enviar")

        function pegarDados() {
            return {
                nome: document.getElementById("nome").value,
                cpf: document.getElementById("cpf").value,
                celular: document.getElementById("celular").value,
                email: document.getElementById("email").value,
                senha: document.getElementById("senha").value
            }
        }

        form_cadastro.addEventListener("submit", async (event) => {
            event.preventDefault()
            btn_enviar.disabled = true
            btn_enviar.value = "Enviando cadastro..."
            try {
                const resposta = await fetch(API_URL + "/cliente", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(pegarDados())
                })
                const json_resposta = await resposta.json()
                if (!resposta.ok) {
                    throw new Error(json_resposta.msg || json_resposta.erro || "Erro na API")
                }
                mostrarToast("✅ Cadastro realizado com sucesso!", "bg-success")
                form_cadastro.reset()
                setTimeout(() => { window.location.href = "login.html" }, 1500)
            } catch (error) {
                mostrarToast("❌ Falha ao enviar. " + error.message, "bg-danger")
            } finally {
                btn_enviar.value = "Enviar Cadastro"
                btn_enviar.disabled = false
            }
        })
    </script>
</body>
</html>
